name: PR Check

on:
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Install SwiftFormat
        run: command -v swiftformat || brew install swiftformat

      - name: Lint
        run: swiftformat --lint EdgeMark/

  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ensure version & build unchanged
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"

          extract() {
            git show "$1:EdgeMark.xcodeproj/project.pbxproj" \
              | grep "$2" | head -1 | sed 's/.*= \(.*\);/\1/' | tr -d ' '
          }

          BASE_VERSION=$(extract "$BASE" MARKETING_VERSION)
          HEAD_VERSION=$(extract "$HEAD" MARKETING_VERSION)
          BASE_BUILD=$(extract "$BASE" CURRENT_PROJECT_VERSION)
          HEAD_BUILD=$(extract "$HEAD" CURRENT_PROJECT_VERSION)

          echo "Base: $BASE_VERSION (build $BASE_BUILD)"
          echo "Head: $HEAD_VERSION (build $HEAD_BUILD)"

          if [ "$BASE_VERSION" != "$HEAD_VERSION" ] || [ "$BASE_BUILD" != "$HEAD_BUILD" ]; then
            echo "::error::Version or build number changed in this PR."
            echo "::error::Version bumps must be made directly on main/develop by the maintainer to control release timing."
            exit 1
          fi

          echo "Version unchanged — OK."

  build:
    needs: lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2"

      - name: Build
        run: |
          xcodebuild -project EdgeMark.xcodeproj -scheme EdgeMark -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY="-" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO build

      - name: Ad-hoc sign preview app
        run: |
          codesign --force --deep --sign - build/Build/Products/Release/EdgeMark.app
          codesign --verify --deep --strict --verbose=2 build/Build/Products/Release/EdgeMark.app

      - name: Create preview DMG
        run: |
          mkdir -p dmg
          cp -R build/Build/Products/Release/EdgeMark.app dmg/
          ln -s /Applications dmg/Applications
          cat > "dmg/安装说明.txt" <<'EOF'
          EdgeMark Preview 是 GitHub Actions 生成的预览构建，已做 ad-hoc 本地签名，但没有 Apple Developer ID 公证。

          安装：
          1. 将 EdgeMark 拖入 Applications。
          2. 首次打开若 macOS 阻止运行，请在终端执行：
             xattr -dr com.apple.quarantine /Applications/EdgeMark.app
          3. 再打开 EdgeMark。

          “双击/Enter 直接粘贴”首次使用需要在：
          系统设置 → 隐私与安全性 → 辅助功能
          中允许 EdgeMark。
          EOF
          hdiutil create -volname "EdgeMark Preview" -srcfolder dmg -ov -format UDZO EdgeMark-preview-arm64.dmg
          shasum -a 256 EdgeMark-preview-arm64.dmg > EdgeMark-preview-arm64.dmg.sha256

      - name: Upload preview package
        uses: actions/upload-artifact@v4
        with:
          name: EdgeMark-preview-arm64
          path: |
            EdgeMark-preview-arm64.dmg
            EdgeMark-preview-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 14
